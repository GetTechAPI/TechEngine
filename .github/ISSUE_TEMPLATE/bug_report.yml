name: "🐛 Bug report"
description: Report a bug in the validator, API server, dump generator, collectors or verification
labels: ["type:bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the exact command or request, and the TechEngine commit you ran.
      placeholder: |
        python -m app.validate
        curl http://localhost:8000/v1/smartphones/galaxy-s25
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: request_id (if any)
      description: For API errors, the `request_id` from the error response.
