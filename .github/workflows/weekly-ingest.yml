name: weekly-ingest

# Weekly: scrape upstream catalogs, draft missing SKUs into a TechAPI worktree,
# open a PR for curator review.
#
# Reusable: TechAPI's weekly-data.yml calls this, so github.token is TechAPI's
# own GITHUB_TOKEN and the branch + PR are created by github-actions[bot].
on:
  workflow_call:
    inputs:
      category:
        description: "Category to ingest (cpu, gpu or smartphone)"
        type: string
        default: cpu
      limit:
        description: "Max candidates per source"
        type: string
        default: "50"
      include_drafts:
        description: "Write incomplete records too (PR marked as draft)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      CATEGORY: ${{ inputs.category || 'cpu' }}
      LIMIT: ${{ inputs.limit || '50' }}
      INCLUDE_DRAFTS: ${{ inputs.include_drafts || 'false' }}
    steps:
      # In a called workflow a bare checkout would fetch the caller (TechAPI).
      - uses: actions/checkout@v4
        with:
          repository: GetTechAPI/TechEngine

      - uses: actions/checkout@v4
        with:
          repository: GetTechAPI/TechAPI
          path: TechAPI
          # TechAPI follows git-flow: ingest is integration work, so branch from
          # develop and open the PR there. main only moves through a release PR.
          ref: develop

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Run ingest
        env:
          TECHAPI_DATA_DIR: ${{ github.workspace }}/TechAPI/data
        run: |
          DRAFTS_FLAG=""
          if [ "$INCLUDE_DRAFTS" = "true" ]; then
            DRAFTS_FLAG="--include-drafts"
          fi
          python -m app.ingest \
            --category "$CATEGORY" \
            --limit "$LIMIT" \
            --data-root TechAPI/data \
            --summary ingest-summary.md \
            $DRAFTS_FLAG

      # Variant-safe benchmark backfill on existing CPU records (PassMark).
      # CPU-only; never overwrites, only fills nulls on exact heading matches.
      # Non-fatal: a scrape hiccup must not sink the weekly ingest PR.
      - name: Enrich benchmarks (PassMark, cpu only)
        if: env.CATEGORY == 'cpu'
        continue-on-error: true
        env:
          TECHAPI_DATA_DIR: ${{ github.workspace }}/TechAPI/data
        run: |
          python -m app.ingest.enrich \
            --data-root TechAPI/data \
            --limit "$LIMIT" \
            --min-year 2008 \
            --sleep 0.5 \
            --summary enrich-summary.md

      - name: Combine summaries for PR body
        run: |
          cp ingest-summary.md pr-body.md
          if [ -f enrich-summary.md ]; then
            printf '\n\n---\n\n' >> pr-body.md
            cat enrich-summary.md >> pr-body.md
          fi

      - name: Upload summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ingest-summary
          path: |
            ingest-summary.md
            enrich-summary.md
            pr-body.md

      - name: Check whether ingest produced any additions
        id: changes
        run: |
          cd TechAPI
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR against TechAPI
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd TechAPI
          BRANCH="ingest/${CATEGORY}-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/
          git commit -m "feat(data/${CATEGORY}): weekly ingest"
          git push -u origin "$BRANCH"
          DRAFT_FLAG=""
          if [ "$INCLUDE_DRAFTS" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi
          gh pr create \
            --title "feat(data/${CATEGORY}): weekly ingest" \
            --body-file ../pr-body.md \
            --base develop \
            --head "$BRANCH" \
            $DRAFT_FLAG
