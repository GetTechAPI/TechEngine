name: verify-promote

# Reusable, manual PR generator (ADR-017). Only TechAPI's collect.yml calls it,
# from workflow_dispatch, so github.token is TechAPI's GITHUB_TOKEN and the
# branch and PR come from github-actions[bot]. Nothing here runs on a schedule,
# posts a comment, or uses a personal or bot-account token. Crawlers send the
# honest TechEngine-* User-Agent and keep their --sleep and limits.
#
# Task: network verification (Tier 1 source-URL liveness, Wikidata, Tier 2
# cross-reference) and `verified` promotion. Dry-run unless `apply` is true;
# with apply, the diff-scope guard allows nothing but `verified` toggles and
# the ledger under data/_verify/.
on:
  workflow_call:
    inputs:
      apply:
        description: "Flip verified->true and open a PR on TechAPI (else dry-run)"
        type: boolean
        default: false
      max_urls:
        description: "Frontier records to URL-check"
        type: string
        default: "2000"
      max_wikidata:
        description: "Maximum Wikidata QIDs to batch-check"
        type: string
        default: "20000"
      max_crossref:
        description: "Records to cross-reference"
        type: string
        default: "500"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: verify-network
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      DRAFT_FLAG: ""
      BRANCH: collect/promote
      TITLE: "data(verify): promote records to verified"
      TECHAPI_DATA_DIR: ${{ github.workspace }}/TechAPI/data
    steps:
      # The TechEngine commit TechAPI pins as its submodule is the engine that
      # runs here, so collection, PR checks and the deploy share one engine.
      - name: Checkout TechAPI develop with its pinned TechEngine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GetTechAPI/TechAPI
          ref: develop
          path: TechAPI
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the pinned TechEngine
        run: pip install -e ./TechAPI/TechEngine

      - name: Restore source URL cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: TechAPI/data/_verify/state/url_cache.jsonl
          key: verify-url-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: verify-url-cache-

      - name: Tier 0 score (recomputed; no committed cache)
        working-directory: TechAPI/TechEngine
        run: python -m app.verify score --no-cache

      - name: Tier 1 source-URL liveness
        working-directory: TechAPI/TechEngine
        run: python -m app.verify check-urls --max "${{ inputs.max_urls }}"

      - name: Batched Wikidata source liveness
        working-directory: TechAPI/TechEngine
        run: python -m app.verify check-wikidata --max "${{ inputs.max_wikidata }}"

      - name: Tier 2 external cross-reference
        working-directory: TechAPI/TechEngine
        run: python -m app.verify crossref --max "${{ inputs.max_crossref }}"

      - name: Tier 3 promote (dry-run)
        working-directory: TechAPI/TechEngine
        run: python -m app.verify promote | tee "$GITHUB_WORKSPACE/promote-dry-run.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Tier 3 promote (apply)
        if: inputs.apply
        working-directory: TechAPI/TechEngine
        run: python -m app.verify promote --apply

      # Guard: the only tracked changes in TechAPI may be `verified` toggles in
      # data/**.json (the ledger under data/_verify/ is expected to change too).
      - name: Guard diff scope
        if: inputs.apply
        run: |
          python - <<'PY'
          import subprocess, sys
          out = subprocess.run(
              ["git", "-C", "TechAPI", "diff", "--unified=0", "--",
               "data/", ":(exclude)data/_verify/**"],
              capture_output=True, text=True).stdout
          bad = []
          for line in out.splitlines():
              if line.startswith(("+++", "---", "@@", "diff ", "index ")):
                  continue
              if line.startswith(("+", "-")) and line[1:].strip():
                  body = line[1:].strip().rstrip(",")
                  if body not in ('"verified": true', '"verified": false'):
                      bad.append(line)
          if bad:
              print("Unexpected non-verified changes:")
              print("\n".join(bad[:50]))
              sys.exit(1)
          print("diff scope OK: only verified toggles")
          PY

      # Commit locally first: the Tier 0 report scores the records this commit
      # changes against develop.
      - name: Commit data changes
        id: commit
        if: inputs.apply
        working-directory: TechAPI
        run: |
          set -euo pipefail
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes; no PR."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -q -m "$TITLE"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Gate: a PR opened with GITHUB_TOKEN triggers no checks, so the gate runs
      # here and its result goes in the PR body. Any failure stops the push.
      - name: Gate (app.validate + integrity_check --strict)
        if: steps.commit.outputs.changed == 'true'
        working-directory: TechAPI/TechEngine
        run: |
          set -euo pipefail
          python -m app.validate
          python integrity_check.py "$TECHAPI_DATA_DIR" --strict

      - name: Tier 0 report for the changed records
        if: steps.commit.outputs.changed == 'true'
        working-directory: TechAPI/TechEngine
        env:
          BASE: ${{ steps.commit.outputs.base }}
        run: |
          python -m app.verify score --base "$BASE" --changed --no-cache --format md \
            > "$GITHUB_WORKSPACE/verify-report.md" 2>&1 \
            || echo "_Tier 0 report unavailable._" > "$GITHUB_WORKSPACE/verify-report.md"

      - name: Build PR body
        if: steps.commit.outputs.changed == 'true'
        run: |
          {
            echo "Closes #296"
            echo
            echo "Generated by TechEngine \`$GITHUB_WORKFLOW\` (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo "Add the \`final-check\` label for the final pass."
            echo
            echo "## Gate"
            echo "- \`app.validate\`: **passed**"
            echo "- \`integrity_check.py --strict\`: **passed**"
            echo
            echo "## Tier 0 verification (changed records)"
            echo
            cat verify-report.md
            echo
            echo "## Promotion run"
            echo
            echo '```'
            cat promote-dry-run.md
            echo '```'
          } > pr-body.md

      # One open PR per task: the fixed branch is cut from develop and
      # force-pushed each run; an open PR is edited in place. No comments.
      - name: Push and open or update the PR
        if: steps.commit.outputs.changed == 'true'
        working-directory: TechAPI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git push --force origin "HEAD:refs/heads/$BRANCH"
          number=$(gh pr list --repo GetTechAPI/TechAPI --head "$BRANCH" --base develop \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo GetTechAPI/TechAPI --title "$TITLE" --body-file ../pr-body.md
          else
            gh pr create --repo GetTechAPI/TechAPI --base develop --head "$BRANCH" \
              --title "$TITLE" --body-file ../pr-body.md $DRAFT_FLAG \
              --assignee Seungpyo1007 --assignee TechEngineBot \
              --label data --label enhancement \
              --milestone "Massive dataset rebuild (1989-2026)"
          fi
