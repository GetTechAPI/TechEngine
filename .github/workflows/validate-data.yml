name: validate-data

# Reusable: TechAPI's PR workflow calls this with the TechAPI ref to validate.
on:
  workflow_call:
    inputs:
      data-ref:
        description: "TechAPI ref (branch/SHA) to validate"
        type: string
        required: false
        default: "main"
      base-sha:
        description: "PR base SHA; when set only records changed since it are validated"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      data-ref:
        description: "TechAPI ref to validate"
        type: string
        required: false
        default: "main"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GetTechAPI/TechAPI
          ref: ${{ inputs.data-ref }}
          path: TechAPI
          # Scoped runs need the diff back to the merge base, not the full history.
          fetch-depth: ${{ inputs.base-sha != '' && 100 || 1 }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate seed JSON (§9.3, §15.3)
        env:
          TECHAPI_DATA_DIR: ${{ github.workspace }}/TechAPI/data
        run: |
          if [ -n "${{ inputs.base-sha }}" ]; then
            git -C TechAPI fetch --no-tags --depth=100 origin "${{ inputs.base-sha }}"
            git -C TechAPI merge-base "${{ inputs.base-sha }}" HEAD >/dev/null 2>&1 \
              || git -C TechAPI fetch --no-tags --unshallow origin
            python -m app.validate --changed-since "${{ inputs.base-sha }}"
          else
            python -m app.validate
          fi
