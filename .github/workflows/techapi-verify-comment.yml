name: techapi-verify-comment

# Reusable: Tier 0 data verification for a TechAPI PR. TechAPI calls this from
# verify-report.yml (mode=tier0, every data PR) and verify-command.yml (mode=all,
# on a `/verify` comment). Checks out the PR head, runs app.verify, and posts the
# green/yellow/red band report on the PR with TechAPI's own GITHUB_TOKEN.
on:
  workflow_call:
    inputs:
      pr_number:
        description: "TechAPI PR number to verify + comment on"
        type: string
        required: true
      head_sha:
        description: "TechAPI commit SHA to verify"
        type: string
        required: true
      base_ref:
        description: "TechAPI PR base branch (resolved from PR if omitted)"
        type: string
        required: false
        default: ""
      base_sha:
        description: "TechAPI PR base SHA (resolved from PR if omitted)"
        type: string
        required: false
        default: ""
      mode:
        description: "tier0 = automatic PR report; all = on-demand /verify (Tiers 0-3)"
        type: string
        required: false
        default: "all"
      requested_by:
        description: "Login shown as the requester in the comment"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: techapi-verify-${{ inputs.pr_number }}-${{ inputs.mode }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      TECHAPI_PR_NUMBER: ${{ inputs.pr_number }}
      TECHAPI_BASE_REF: ${{ inputs.base_ref }}
      TECHAPI_BASE_SHA: ${{ inputs.base_sha }}
      TECHAPI_HEAD_SHA: ${{ inputs.head_sha }}
      REQUESTED_BY: ${{ inputs.requested_by || github.actor }}
      MODE: ${{ inputs.mode }}
    steps:
      # In a called workflow a bare checkout would fetch the caller (TechAPI).
      - name: Checkout TechEngine
        uses: actions/checkout@v4
        with:
          repository: GetTechAPI/TechEngine

      - name: Resolve actual PR base
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TECHAPI_BASE_REF" ] || [ -z "$TECHAPI_BASE_SHA" ]; then
            gh api "repos/GetTechAPI/TechAPI/pulls/$TECHAPI_PR_NUMBER" > pr-base.json
            TECHAPI_BASE_REF=$(jq -r '.base.ref' pr-base.json)
            TECHAPI_BASE_SHA=$(jq -r '.base.sha' pr-base.json)
          fi
          echo "TECHAPI_BASE_REF=$TECHAPI_BASE_REF" >> "$GITHUB_ENV"
          echo "TECHAPI_BASE_SHA=$TECHAPI_BASE_SHA" >> "$GITHUB_ENV"

      - name: Checkout TechAPI PR head
        uses: actions/checkout@v4
        with:
          repository: GetTechAPI/TechAPI
          ref: ${{ env.TECHAPI_HEAD_SHA }}
          path: TechAPI
          # Shallow: the diff only needs history back to the merge base, fetched
          # below. A full clone was ~58% of this job's runtime.
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install TechEngine
        run: pip install -e .

      # app.verify now lives in TechEngine; run it from the engine root with
      # TECHAPI_DATA_DIR pointing at the TechAPI checkout (its `_changed_data_slugs`
      # runs git inside that data repo). mode=tier0 = fast offline Tier 0 (auto PR
      # report); mode=all = `pr` Tiers 0-3 (3 = promotion DRY-RUN).
      - name: Run verification
        id: verify
        env:
          TECHAPI_DATA_DIR: ${{ github.workspace }}/TechAPI/data
        run: |
          # Deepen just enough for `base...HEAD` to find a merge base; fall back
          # to the full history only if the PR branched from far back.
          git -C TechAPI fetch --no-tags --depth=100 origin "$TECHAPI_BASE_SHA" "$TECHAPI_HEAD_SHA"
          git -C TechAPI merge-base "$TECHAPI_BASE_SHA" "$TECHAPI_HEAD_SHA" >/dev/null 2>&1 \
            || git -C TechAPI fetch --no-tags --unshallow origin
          {
            echo 'report<<VERIFY_EOF'
            python -m app.dump_check --base "$TECHAPI_BASE_SHA" --base-ref "$TECHAPI_BASE_REF" --scope-only
            echo ""
            if [ "${MODE}" = "tier0" ]; then
              echo "### Changed records in this PR"
              echo ""
              python -m app.verify score --base "$TECHAPI_BASE_SHA" --changed --no-cache --format md || echo "_app.verify unavailable on this ref._"
              echo ""
              echo "### Full-dataset baseline"
              echo ""
              # Read the daily aggregate (verify-status.yml) instead of rescoring
              # all ~190k records on every PR.
              python -m app.verify.baseline "$TECHAPI_DATA_DIR/_verify/status.json" || true
            else
              python -m app.verify pr --base "$TECHAPI_BASE_SHA" || echo "_app.verify unavailable on this ref._"
            fi
            echo VERIFY_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Write job summary
        env:
          REPORT: ${{ steps.verify.outputs.report }}
        run: printf '%s\n' "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      # Fork PRs get a read-only token, so commenting can fail there; the job
      # summary above still carries the report.
      - name: Post verification comment
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.verify.outputs.report }}
          PR_NUMBER: ${{ env.TECHAPI_PR_NUMBER }}
          REQUESTED_BY: ${{ env.REQUESTED_BY }}
          MODE: ${{ env.MODE }}
        with:
          script: |
            const report = (process.env.REPORT || '').trim() || '(no output)';
            const by = process.env.REQUESTED_BY || 'someone';
            const isTier0 = (process.env.MODE || 'all') === 'tier0';
            // Auto report and on-demand /verify use distinct marked comments.
            const marker = isTier0
              ? '<!-- techengine-verify-report -->'
              : '<!-- techengine-verify-command -->';
            const head = isTier0
              ? ['## 🔎 Data verification — Tier 0 (offline existence/trust)', '',
                 'Scored by `app.verify`. Informational only — the structural gate (`app.validate`) is separate and authoritative for merge.', '',
                 report]
              : [report];  // `pr` emits its own H2 heading + tier sections
            const footer = isTier0
              ? '<sub>green = authoritative source + complete + consistent · yellow = plausible, needs confirmation · red = sparse/weak source or a hard contradiction. Promotion to `verified` runs in the scheduled `verify-network` workflow.</sub>'
              : `<sub>Requested by @${by} via \`/verify\` · scored by \`app.verify\`. Informational only — the structural gate (\`app.validate\`) is separate; Tier 3 here is dry-run.</sub>`;
            const body = [marker, ...head, '', footer].join('\n');
            const owner = 'GetTechAPI';
            const repo = 'TechAPI';
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
