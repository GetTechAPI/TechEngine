name: coverage-report

# On demand: pull upstream catalogs, diff vs the curated TechAPI dataset, and
# publish the gap list as the job summary plus an artifact. Read-only: it
# writes no issues, comments or commits, and never runs on a schedule.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GetTechAPI/TechAPI
          path: TechAPI

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Build coverage report
        env:
          TECHAPI_DATA_DIR: ${{ github.workspace }}/TechAPI/data
        run: python -m app.coverage --output coverage-report.md

      - name: Publish report to the job summary
        run: cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage-report.md
