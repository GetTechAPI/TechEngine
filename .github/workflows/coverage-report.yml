name: coverage-report

# Weekly: pull upstream catalogs, diff vs the curated TechAPI dataset, post
# the gap list as a sticky issue in this repo (auto-updates the existing one).
on:
  schedule:
    - cron: "23 6 * * 1"   # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Guard against a slow run overlapping the next scheduled run.
concurrency:
  group: coverage-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: GetTechAPI/TechAPI
          path: TechAPI

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Build coverage report
        env:
          TECHAPI_DATA_DIR: ${{ github.workspace }}/TechAPI/data
        run: python -m app.coverage --output coverage-report.md

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report.md

      # Sticky issue: keep one open issue with the well-known title, updating it
      # in place. Only this repo, with its own GITHUB_TOKEN (github-actions[bot]).
      - name: Sync sticky coverage issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="Coverage gaps (auto-generated)"
          NUMBER=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -z "${NUMBER:-}" ]; then
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file coverage-report.md
          else
            gh issue edit "$NUMBER" --repo "${{ github.repository }}" --body-file coverage-report.md
          fi
